apiVersion: v1
kind: Service
metadata:
  name: prod-{{ include "docs.fullname" . }}-service
  labels:
  {{- include "docs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: docs-app
  {{- include "docs.selectorLabels" . | nindent 4 }}
  ports: {{- .Values.service.ports | toYaml | nindent 2 }}